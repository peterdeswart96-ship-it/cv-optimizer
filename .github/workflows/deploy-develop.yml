name: Deploy Backend (develop)

on:
  push:
    branches: [develop]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verwijder WEBSITE_RUN_FROM_PACKAGE
        run: |
          az functionapp config appsettings delete \
            --name func-cv-optimizer-linux \
            --resource-group rg-cv-optimizer \
            --setting-names WEBSITE_RUN_FROM_PACKAGE

      - name: Deploy Azure Functions
        run: |
          cd backend
          func azure functionapp publish func-cv-optimizer-linux --javascript

      - name: Verifieer deployment
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://func-cv-optimizer-linux.azurewebsites.net/api/analyze \
            -H "Content-Type: application/json" \
            -d '{"test": true}')
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "401" ]; then
            echo "Verwachte 401, kreeg $STATUS — deployment mogelijk mislukt"
            exit 1
          fi
          echo "Deployment succesvol geverifieerd (401 = auth werkt)"
